[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-encoding"
version = "0.1.0"
description = "Categorical encoding choices and their impact on churn targeting (one-hot vs target encoding, IBM Telco)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jingyi Yang" }]
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10",
  "scikit-learn>=1.4", "matplotlib>=3.7", "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
